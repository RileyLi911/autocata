workflow:
    adsorbate: "CH3"
    target_success_count: 1
    max_rounds: 1
    generation_per_round: 5
    output_root: "outputs/workflows"
    run_name: "minimal_ch3_v3"
    adsorbate_registry: "config/adsorbates.yml"

    fine_tune:
        enabled: false
        require_existing_checkpoint: true

    device:
        generation: "cpu"
        mlp: "cpu"

    generation:
        batch_size: 8
        max_length: 512
        top_k: 30
        top_p: 0.9
        temperature: 1.0

    material_query:
        mode: "any"
        elements: []

    filters:
        require_adsorbate_valid: true
        mlp_energy_gt: null
        mlp_energy_lt: 0.0

    duplicate_check:
        enabled: false

    viewer:
        auto_open: false

    preview:
        enabled: true
        max_structures: 5
        frames: 12
        image_width: 720
        image_height: 540
        gif_duration_ms: 160
        gif: true

    keep_failed_structures: false
