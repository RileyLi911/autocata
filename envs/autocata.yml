name: autocata

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.9
  - pip

  # Core scientific stack
  - numpy=1.24.*
  - pandas=2.2.*
  - scipy=1.11.4
  - tqdm
  - pyyaml
  - lmdb

  # Materials stack used by AutoCata parsing/validation
  - pymatgen=2023.11.12
  - matminer=0.9.2

  # PyTorch CUDA runtime. Works with newer NVIDIA drivers that support CUDA 12.x.
  - pytorch=2.4.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # Training utilities
  - pytorch-lightning=2.1.2
  - torchmetrics=1.2.1

  - pip:
      - ase==3.22.1
      - transformers==4.51.3
      - datasets==3.5.0
      - peft==0.8.2
      - omegaconf==2.3.0
      - smact==2.2.1
      - wandb==0.16.4
      - safetensors
      - accelerate
      - eval_type_backport
      - huggingface_hub>=0.23
      - pillow>=10.0

      # OC20 MLP scoring. The previous ocp_mlp environment used fairchem-core==1.10.
      - fairchem-core==1.10

      # PyG wheels matching torch==2.4.0 and CUDA 12.1.
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cu121.html
      - pyg_lib
      - torch_scatter
      - torch_sparse
      - torch_cluster
      - torch_spline_conv
      - torch-geometric
